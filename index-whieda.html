<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whieda</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{background:#101522;color:#f7f9ff;max-width:960px;margin:0 auto;padding:24px}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #526078}input{background:#1d2638;color:white;max-width:100%;box-sizing:border-box}button{background:#6558ee;color:white;cursor:pointer}button:disabled{opacity:.6}.card{background:#1a2233;border-radius:14px;padding:20px;margin:15px 0}.hidden{display:none}form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}video{width:100%;max-height:500px;background:black;border-radius:12px}.muted{color:#b7c2d5}a{color:#a6b7ff}li{margin:9px 0}#message{min-height:1.5em}
</style></head><body><h1>▶ Whieda</h1><p class="muted">Для просмотра нужно войти. Мы записываем ваше имя и время начала просмотра, чтобы автор видео видел статистику.</p><p id="message" role="status"></p>
<section id="auth" class="card"><h2>Вход</h2><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Пароль" required minlength="6"><button>Войти</button></form><h2>Регистрация</h2><form id="registerForm"><input id="displayName" placeholder="Ваше имя" required maxlength="60"><input id="registerEmail" type="email" placeholder="Email" required><input id="registerPassword" type="password" placeholder="Пароль (от 6 символов)" minlength="6" required><button>Зарегистрироваться</button></form></section>
<section id="app" class="hidden"><p>Вы вошли как <strong id="userName"></strong> <button id="logout">Выйти</button></p><div id="videos"></div></section>
<section id="admin" class="card hidden"><h2>Панель автора</h2><p class="muted">Добавляй прямые HTTPS-ссылки на видеофайлы MP4/WebM, размещённые на разрешённом хостинге.</p><form id="addVideoForm"><input id="videoTitle" placeholder="Название видео" maxlength="120" required><input id="videoUrl" type="url" placeholder="https://.../video.mp4" required><button>Добавить</button></form><h3>Последние просмотры</h3><ul id="views"></ul></section>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,addDoc,getDocs,query,orderBy,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
// Настройки Firebase уже подключены
const firebaseConfig = {
  apiKey: "AIzaSyBzAU3BJFsGItgC7Ixf-NHVJdGcC9jeBfk",
  authDomain: "wieda-video-98651.firebaseapp.com",
  projectId: "wieda-video-98651",
  storageBucket: "wieda-video-98651.firebasestorage.app",
  messagingSenderId: "509525744800",
  appId: "1:509525744800:web:4e20697db2950187c9fdc5",
  measurementId: "G-PCXMKME2YW"
};
// ЗАМЕНИ НА UID СВОЕГО АККАУНТА ИЗ FIREBASE AUTHENTICATION
const ADMIN_UID='PASTE_ADMIN_UID';
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=id=>document.getElementById(id);let currentUser=null,played=new Set();
function msg(s){$('message').textContent=s}function error(e){msg('Ошибка: '+(e?.message||String(e)))}
$('registerForm').onsubmit=async e=>{e.preventDefault();try{let name=$('displayName').value.trim();if(!name)throw Error('Укажи имя');let r=await createUserWithEmailAndPassword(auth,$('registerEmail').value,$('registerPassword').value);await updateProfile(r.user,{displayName:name});await setDoc(doc(db,'users',r.user.uid),{name:name,email:r.user.email,createdAt:serverTimestamp()});await refresh(r.user);msg('Регистрация успешна')}catch(x){error(x)}};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value);msg('Вход выполнен')}catch(x){error(x)}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{currentUser=u;played.clear();$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('admin').classList.toggle('hidden',!u||u.uid!==ADMIN_UID);if(u)await refresh(u);else msg('')});
async function refresh(u){$('userName').textContent=u.displayName||u.email;try{let snap=await getDocs(query(collection(db,'videos'),orderBy('createdAt','desc')));let root=$('videos');root.replaceChildren();if(snap.empty)root.textContent='Видео пока нет.';snap.forEach(d=>{let v=d.data();let card=document.createElement('div');card.className='card';let h=document.createElement('h2');h.textContent=v.title;let video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=v.url;video.addEventListener('play',async()=>{if(played.has(d.id))return;played.add(d.id);try{await addDoc(collection(db,'views'),{videoId:d.id,videoTitle:v.title,viewerUid:u.uid,viewerName:u.displayName||u.email,viewedAt:serverTimestamp()});if(u.uid===ADMIN_UID)loadViews()}catch(x){played.delete(d.id);error(x)}});card.append(h,video);root.append(card)});if(u.uid===ADMIN_UID)await loadViews()}catch(x){error(x)}}
$('addVideoForm').onsubmit=async e=>{e.preventDefault();if(currentUser?.uid!==ADMIN_UID)return;try{let url=new URL($('videoUrl').value);if(url.protocol!=='https:')throw Error('Нужна HTTPS-ссылка');await addDoc(collection(db,'videos'),{title:$('videoTitle').value.trim(),url:url.href,createdAt:serverTimestamp()});$('addVideoForm').reset();await refresh(currentUser);msg('Видео добавлено')}catch(x){error(x)}};
async function loadViews(){try{let snap=await getDocs(query(collection(db,'views'),orderBy('viewedAt','desc'),limit(100)));let root=$('views');root.replaceChildren();if(snap.empty)root.textContent='Просмотров пока нет.';snap.forEach(d=>{let v=d.data(),li=document.createElement('li');li.textContent=`${v.viewerName||'Зритель'} — ${v.videoTitle||'Видео'} — ${v.viewedAt?.toDate().toLocaleString('ru-RU')||'только что'}`;root.append(li)})}catch(x){error(x)}}
</script></body></html>
